apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow
  labels:
    app: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderflow
  template:
    metadata:
      labels:
        app: orderflow
    spec:
      containers:
      - name: orderflow
        image: orderflow:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: OF_DASH_INSTANCE_ID
          value: "orderflow-k8s"
        - name: OF_DASH_VENUE
          value: "CME"
        - name: OF_DASH_SYMBOL
          value: "ESM6"
        - name: OF_DASH_TOKEN
          valueFrom:
            secretKeyRef:
              name: orderflow-secret
              key: dashboard-token
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /state
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /state
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow
spec:
  selector:
    app: orderflow
  ports:
  - port: 8080
    targetPort: http
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secret
type: Opaque
stringData:
  dashboard-token: "change-me-in-production"
