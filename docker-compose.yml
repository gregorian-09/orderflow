version: "3.9"
services:
  orderflow:
    build: .
    ports:
      - "8080:8080"
    environment:
      OF_DASH_INSTANCE_ID: orderflow-prod
      OF_DASH_HOST: 0.0.0.0
      OF_DASH_PORT: "8080"
      OF_DASH_VENUE: CME
      OF_DASH_SYMBOL: ESM6
      OF_DASH_DEPTH: "10"
      OF_DASH_BAR_EVENTS: "24"
      OF_DASH_MAX_BARS: "120"
      OF_DASH_DATA_ROOT: /opt/orderflow/data
      OF_DASH_TOKEN: "${OF_DASH_TOKEN:-}"
      OF_RUNTIME_MAX_EVENTS_PER_POLL: "100"
      RUST_LOG: info
    volumes:
      - ./data:/opt/orderflow/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os, urllib.request; port = os.getenv('OF_DASH_PORT', '8080'); req = urllib.request.Request('http://127.0.0.1:%s/state' % port); token = os.getenv('OF_DASH_TOKEN'); req.add_header('X-Orderflow-Token', token) if token else None; urllib.request.urlopen(req, timeout=2).close()"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
