name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation toolchain
        run: python -m pip install --requirement docs/requirements.txt

      - name: Refresh documentation inventory
        run: python3 tools/generate_docs_inventory.py

      - name: Refresh Rust surface audit
        run: python3 tools/generate_rust_surface.py

      - name: Refresh binding surface audit
        run: python3 tools/generate_binding_surface.py

      - name: Refresh Rust values audit
        run: python3 tools/generate_rust_values.py

      - name: Refresh package matrix
        run: python3 tools/generate_package_matrix.py

      - name: Refresh crate reference pages
        run: python3 tools/generate_crate_pages.py

      - name: Refresh semantic API reference
        run: python3 tools/enrich_api_reference.py

      - name: Check documentation inventory
        run: python3 tools/generate_docs_inventory.py --check

      - name: Check Rust surface audit
        run: python3 tools/generate_rust_surface.py --check

      - name: Check binding surface audit
        run: python3 tools/generate_binding_surface.py --check

      - name: Check Rust values audit
        run: python3 tools/generate_rust_values.py --check

      - name: Check package matrix
        run: python3 tools/generate_package_matrix.py --check

      - name: Check crate reference pages
        run: python3 tools/generate_crate_pages.py --check

      - name: Check semantic API reference
        run: python3 tools/enrich_api_reference.py --check

      - name: Build Rust API reference
        run: cargo doc --workspace --all-features --no-deps

      - name: Validate API inventory
        run: python3 tools/generate_api_inventory.py --check

      - name: Validate documentation coverage
        run: python3 tools/docs_coverage.py --enforce

      - name: Validate C ABI manifest
        run: python3 tools/check_api_manifest.py

      - name: Build documentation site
        run: bash tools/build_docs.sh site
