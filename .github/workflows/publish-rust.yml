name: Publish Rust Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Validate crate packages
        if: github.event_name == 'push' || inputs.dry_run
        run: |
          set -euo pipefail
          publish_order="$(python3 tools/release/validate_release_manifest.py --print-publish-order)"
          test -n "$publish_order"
          mapfile -t crates <<<"$publish_order"
          for crate in "${crates[@]}"; do
            cargo check --locked -p "$crate"
            package_files="$(cargo package -p "$crate" --allow-dirty --list)"
            test -n "$package_files"
            grep -qx "Cargo.toml" <<<"$package_files"
            grep -qx "README.md" <<<"$package_files"
          done

          # The dependency root can receive Cargo's complete archive check now.
          # Downstream 0.5/0.1 packages receive the same check during ordered
          # publication after each new internal dependency reaches crates.io.
          cargo package -p of_core --allow-dirty

      - name: Require approved release tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: python3 tools/release/validate_release_ref.py

      - name: Upload crates.io packages
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crate_version() {
            cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          crate = sys.argv[1]
          packages = json.load(sys.stdin)["packages"]
          print(next(package["version"] for package in packages if package["name"] == crate))
          ' "$1"
          }

          wait_for_registry() {
            local crate="$1"
            local version="$2"
            for attempt in $(seq 1 20); do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                echo "${crate}@${version} is available from crates.io."
                return 0
              fi
              echo "Waiting for ${crate}@${version} to reach the crates.io index (${attempt}/20)."
              sleep 15
            done
            echo "::error::${crate}@${version} was not visible after five minutes."
            return 1
          }

          publish_order="$(python3 tools/release/validate_release_manifest.py --print-publish-order)"
          test -n "$publish_order"
          mapfile -t crates <<<"$publish_order"
          for crate in "${crates[@]}"; do
            version="$(crate_version "$crate")"
            set +e
            publish_output="$(cargo publish -p "$crate" 2>&1)"
            publish_status=$?
            set -e
            echo "$publish_output"
            if [ $publish_status -eq 0 ]; then
              wait_for_registry "$crate" "$version"
              continue
            fi
            if echo "$publish_output" | grep -Eqi "already (uploaded|exists|published)"; then
              echo "Skipping ${crate}; this version is already published."
              continue
            fi
            if echo "$publish_output" | grep -Eqi "Too Many Requests|published too many new crates"; then
              echo "::error::Crates publish rate limit hit. Re-run this workflow after the retry time in the cargo error."
            fi
            exit $publish_status
          done
