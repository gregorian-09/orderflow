name: Publish Rust Crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "main"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Validate crate packages
        if: github.event_name == 'push' || inputs.dry_run
        run: |
          set -euo pipefail
          for crate in of_core of_analytics of_execution_core of_fix of_signals of_persist of_persist_parquet of_adapters of_runtime of_execution of_execution_algos of_execution_adapters of_ffi_c; do
            cargo check -p "$crate"
            cargo package -p "$crate" --allow-dirty --no-verify
          done

      - name: Publish crates.io
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          crate_version() {
            cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          crate = sys.argv[1]
          packages = json.load(sys.stdin)["packages"]
          print(next(package["version"] for package in packages if package["name"] == crate))
          ' "$1"
          }

          wait_for_registry() {
            local crate="$1"
            local version="$2"
            for attempt in $(seq 1 20); do
              if cargo info "${crate}@${version}" >/dev/null 2>&1; then
                echo "${crate}@${version} is available from crates.io."
                return 0
              fi
              echo "Waiting for ${crate}@${version} to reach the crates.io index (${attempt}/20)."
              sleep 15
            done
            echo "::error::${crate}@${version} was not visible after five minutes."
            return 1
          }

          for crate in of_core of_analytics of_execution_core of_fix of_signals of_persist of_persist_parquet of_adapters of_runtime of_execution of_execution_algos of_execution_adapters of_ffi_c; do
            version="$(crate_version "$crate")"
            set +e
            publish_output="$(cargo publish -p "$crate" 2>&1)"
            publish_status=$?
            set -e
            echo "$publish_output"
            if [ $publish_status -eq 0 ]; then
              wait_for_registry "$crate" "$version"
              continue
            fi
            if echo "$publish_output" | grep -Eqi "already (uploaded|exists|published)"; then
              echo "Skipping ${crate}; this version is already published."
              continue
            fi
            if echo "$publish_output" | grep -Eqi "Too Many Requests|published too many new crates"; then
              echo "::error::Crates publish rate limit hit. Re-run this workflow after the retry time in the cargo error."
            fi
            exit $publish_status
          done
