[package]
name = "of_analytics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Advanced market microstructure analytics for Orderflow"
readme = "README.md"
documentation = "https://docs.rs/of_analytics"
keywords = ["orderflow", "analytics", "microstructure", "trading"]
categories = ["finance", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["market-quality", "liquidity"]
market-quality = []
liquidity = []
impact = []
toxicity = []
volatility = []
regime = []
data-quality = []
feature-vector = []
patterns = []
derivatives = []
institutional = []
ml-features = []
all = [
  "market-quality",
  "liquidity",
  "impact",
  "toxicity",
  "volatility",
  "regime",
  "data-quality",
  "feature-vector",
  "patterns",
  "derivatives",
  "institutional",
  "ml-features",
]

[dependencies]
of_core = { path = "../of_core", version = "0.4.0" }
