[package]
name = "of_execution_adapters"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Execution adapter infrastructure for Orderflow venues and broker protocols"
readme = "README.md"
documentation = "https://docs.rs/of_execution_adapters"
keywords = ["orderflow", "execution", "fix", "adapters", "finance"]
categories = ["finance", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
fix = ["dep:of_fix"]

[dependencies]
of_execution = { path = "../of_execution", version = "0.2.0" }
of_execution_core = { path = "../of_execution_core", version = "0.2.0" }
of_fix = { path = "../of_fix", version = "0.1.0", optional = true }
