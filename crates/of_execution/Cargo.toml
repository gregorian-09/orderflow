[package]
name = "of_execution"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Execution routing, adapter contracts, simulated execution, and recovery hooks for Orderflow"
readme = "README.md"
documentation = "https://docs.rs/of_execution"
keywords = ["orderflow", "execution", "oms", "routing", "finance"]
categories = ["finance", "simulation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
of_execution_core = { path = "../of_execution_core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
