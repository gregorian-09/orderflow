[package]
name = "of_persist_parquet"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Verified Apache Parquet cold export for Orderflow market-data WALs"
readme = "README.md"
documentation = "https://docs.rs/of_persist_parquet"
keywords = ["orderflow", "parquet", "market-data", "trading", "finance"]
categories = ["finance", "database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
arrow-array = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0", default-features = false }
of_persist = { path = "../of_persist", version = "0.4.0" }
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
sha2 = { version = "0.10.9", default-features = false }

[dev-dependencies]
of_core = { path = "../of_core", version = "0.4.0" }
