version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "1.91"
  jobs:
    post_checkout:
      - python3 tools/generate_docs_inventory.py
      - python3 tools/generate_rust_surface.py
      - python3 tools/generate_binding_surface.py
      - python3 tools/generate_rust_values.py
      - python3 tools/generate_package_matrix.py
      - python3 tools/generate_crate_pages.py
      - python3 tools/enrich_api_reference.py
      - python3 tools/enrich_handbook_public_lists.py
    pre_build:
      - cargo doc --workspace --all-features --no-deps
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/reference/rust"
      - cp -a target/doc/. "$READTHEDOCS_OUTPUT/html/reference/rust/"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
